name: Release

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/skills-registry-server

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      continue: ${{ steps.check.outputs.continue }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check version and create tag
        id: check
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v$VERSION"
          echo "Checking tag $TAG..."
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists. Overwriting..."
          else
            echo "Tag $TAG does not exist. Creating..."
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force create/update and push tag
          git tag -f -a "$TAG" -m "Release $TAG"
          git push -f origin "$TAG"
          
          echo "continue=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  docker-publish:
    name: Docker Publish
    needs: prepare-release
    if: needs.prepare-release.outputs.continue == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@e98e4d1628a5f3be2be7c231e50981aee98723ae # v4.0.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ vars.DOCKER_USERNAME }}/skills-registry-server
          readme: ./README-docker.md

  npm-publish:
    name: NPM Publish
    needs: prepare-release
    if: needs.prepare-release.outputs.continue == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Prepare for NPM (Swap README)
        run: cp README-npm.md README.md

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          
          if npm view "${PACKAGE_NAME}@${VERSION}" > /dev/null 2>&1; then
            echo "Version ${VERSION} of ${PACKAGE_NAME} already published. Skipping."
          else
            npm publish
          fi

  create-release:
    name: Create Release
    needs: [prepare-release, docker-publish, npm-publish]
    if: needs.prepare-release.outputs.continue == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name='${{ needs.prepare-release.outputs.tag }}' \
            --jq .body > generated_notes.md

      - name: Create Release Body
        run: |
          echo "Docker Image: https://hub.docker.com/r/ydokimura/skills-registry-server/tags?name=${{ needs.prepare-release.outputs.version }}" > release_body.md
          echo "NPM Package:  https://www.npmjs.com/package/@ydokimura/skills-registry-server/v/${{ needs.prepare-release.outputs.version }}" >> release_body.md
          echo "" >> release_body.md
          echo "## What's Changed" >> release_body.md
          cat generated_notes.md >> release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          body_path: release_body.md
